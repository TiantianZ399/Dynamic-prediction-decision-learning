[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-portfolio-rl"
version = "0.1.0"
description = "Deep prediction and reinforcement-learning decision layers for dynamic portfolio optimization."
authors = [{name = "Tiantian Zhang", email = "t.zhang8@columbia.edu"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "torch>=2.0",
  "matplotlib>=3.6",
  "pyyaml>=6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
